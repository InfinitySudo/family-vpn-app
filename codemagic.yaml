# Сборка iOS «Окно» → TestFlight на Codemagic (GitHub Actions без macOS-подписи не тянет).
# Секреты: группа asc_signing (ASC API key + CERTIFICATE_PRIVATE_KEY), группа okno (SUBSCRIPTION_URL).
workflows:
  ios-testflight:
    name: iOS — Окно → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: app_store_connect_artem
    environment:
      groups: [asc_signing, okno]
      vars:
        BUNDLE_ID: app.okno.family
        TUNNEL_BUNDLE_ID: app.okno.family.HiddifyPacketTunnel
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Prepare (pub get, codegen, translations)
        script: |
          set -e
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
      - name: Fetch hiddify-core iOS framework
        script: |
          set -e
          CORE_VERSION=$(grep core.version dependencies.properties | cut -d= -f2)
          mkdir -p ios/Frameworks && rm -rf ios/Frameworks/HiddifyCore.xcframework
          curl -fL "https://github.com/hiddify/hiddify-core/releases/download/v${CORE_VERSION}/hiddify-lib-ios.tar.gz" | tar xz -C ios/Frameworks
          ls -la ios/Frameworks
      - name: Pod install
        script: cd ios && pod install --repo-update
      - name: Build and sign iOS
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" --create
          app-store-connect fetch-signing-files "$TUNNEL_BUNDLE_ID" --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" --create
          keychain add-certificates
          BUILD_NUMBER=$(($(date +%s) % 100000000))
          cat > /tmp/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store</string>
          <key>teamID</key><string>K7BZZQL253</string>
          <key>signingStyle</key><string>manual</string>
          <key>uploadSymbols</key><true/>
          <key>provisioningProfiles</key><dict>
          <key>app.okno.family</key><string>Okno ios_app_store 1788478556</string>
          <key>app.okno.family.HiddifyPacketTunnel</key><string>Okno Packet Tunnel ios_app_store 1788478557</string>
          </dict>
          </dict></plist>
          PLIST
          # штатная сборка ipa: правильно вкладывает Flutter.framework и HiddifyCore (белый экран был из-за ручной архивации)
          flutter build ipa --release --target lib/main_prod.dart --build-number "$BUILD_NUMBER" \
            --dart-define sentry_dsn= --dart-define subscription_url="$SUBSCRIPTION_URL" \
            --export-options-plist /tmp/export.plist
          mkdir -p build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  macos-notarize:
    name: macOS — подпись Developer ID + нотаризация
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: app_store_connect_artem
    environment:
      groups: [asc_signing, macos_devid, okno]
      vars:
        BUNDLE_ID: app.okno.family
      flutter: 3.38.5
      xcode: latest
    scripts:
      - name: Prepare
        script: |
          set -e
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
      - name: Fetch hiddify-core macOS framework
        script: |
          set -e
          # Пин СТАБИЛЬНОГО ядра v4.1.0 для macOS: draft-бинарь ядра генерил битый DNS
          # (dns-remote-no-warp -> пустой direct), из-за чего подключение падало
          # "detour to an empty direct outbound". iOS остаётся на draft (там работает).
          make macos-libs CHANNEL=prod core.version=4.1.0
      - name: Import Developer ID certificate
        script: |
          set -e
          keychain initialize
          KC="$HOME/Library/codemagic-cli-tools/keychains/$(ls -t $HOME/Library/codemagic-cli-tools/keychains | head -1)"
          echo "keychain: $KC"
          echo "$MACOS_DEVID_CERT_P12_B64" | base64 --decode > /tmp/devid.p12
          keychain add-certificates --certificate /tmp/devid.p12 --certificate-password "$MACOS_DEVID_CERT_PASSWORD"
          # промежуточные+корень Apple: DER -> PEM и импорт в ту же связку (иначе цепочка не строится -> errSecInternalComponent)
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o /tmp/g2.cer
          curl -fsSL https://www.apple.com/appleca/AppleIncRootCertificate.cer -o /tmp/root.cer
          for c in g2 root; do openssl x509 -inform DER -in /tmp/$c.cer -out /tmp/$c.pem; security import /tmp/$c.pem -k "$KC" -T /usr/bin/codesign || true; done
          # разрешить codesign использовать приватный ключ без запроса пароля
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KC" || true
          security find-identity -v -p codesigning "$KC"
      - name: Build & sign macOS app
        script: |
          set -e
          flutter build macos --release --target lib/main_prod.dart \
            --dart-define sentry_dsn= --dart-define subscription_url="$SUBSCRIPTION_URL"
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ENT="$CM_BUILD_DIR/macos/Runner/Release.entitlements"
          IDENT="Developer ID Application"
          # 1) подписать все вложенные dylib/framework/helper ПЕРВЫМИ (жёсткий рантайм + те же entitlements для Go-ядра)
          find "$APP" \( -name "*.dylib" -o -name "*.so" \) -print0 | while IFS= read -r -d "" f; do
            codesign --force --options runtime --timestamp --entitlements "$ENT" --sign "$IDENT" "$f"
          done
          find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.framework" -print0 2>/dev/null | while IFS= read -r -d "" fw; do
            codesign --force --options runtime --timestamp --sign "$IDENT" "$fw"
          done
          # 1b) подписать вложенные helper-приложения/xpc (LoginItems LaunchAtLoginHelper.app и пр.) — иначе их подпись остаётся невалидной
          find "$APP" \( -name "*.app" -o -name "*.xpc" -o -name "*.appex" \) -not -path "$APP" -print0 | while IFS= read -r -d "" nested; do
            codesign --force --options runtime --timestamp --entitlements "$ENT" --sign "$IDENT" "$nested"
          done
          # 2) подписать само приложение С entitlements (иначе allow-jit/unsigned-mem/disable-lib-validation срезаются)
          codesign --force --options runtime --timestamp --entitlements "$ENT" --sign "$IDENT" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" | grep -i "library-validation\|executable-memory" || true
      - name: Make DMG, notarize & staple
        script: |
          set -e
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          npm install -g appdmg || true
          mkdir -p out
          hdiutil create -volname Okno -srcfolder "$APP" -ov -format UDZO out/Okno-macOS.dmg
          echo "$APP_STORE_CONNECT_PRIVATE_KEY_B64" | base64 --decode > /tmp/asc.p8
          xcrun notarytool submit out/Okno-macOS.dmg \
            --key /tmp/asc.p8 --key-id 32D5G8Z738 \
            --issuer 29530fc3-b27b-45ae-8736-b014342b4844 --wait
          xcrun stapler staple out/Okno-macOS.dmg
          spctl -a -vvv -t install out/Okno-macOS.dmg || true
    artifacts:
      - out/*.dmg
    publishing:
      scripts:
        - name: done
          script: echo "Notarized DMG in artifacts"
