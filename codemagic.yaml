# Сборка iOS «Окно» → TestFlight на Codemagic (GitHub Actions без macOS-подписи не тянет).
# Секреты: группа asc_signing (ASC API key + CERTIFICATE_PRIVATE_KEY), группа okno (SUBSCRIPTION_URL).
workflows:
  ios-testflight:
    name: iOS — Окно → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: app_store_connect_artem
    environment:
      groups: [asc_signing, okno]
      vars:
        BUNDLE_ID: app.okno.family
        TUNNEL_BUNDLE_ID: app.okno.family.HiddifyPacketTunnel
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Prepare (pub get, codegen, translations)
        script: |
          set -e
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
      - name: Fetch hiddify-core iOS framework
        script: |
          set -e
          CORE_VERSION=$(grep core.version dependencies.properties | cut -d= -f2)
          mkdir -p ios/Frameworks && rm -rf ios/Frameworks/HiddifyCore.xcframework
          curl -fL "https://github.com/hiddify/hiddify-core/releases/download/v${CORE_VERSION}/hiddify-lib-ios.tar.gz" | tar xz -C ios/Frameworks
          ls -la ios/Frameworks
      - name: Pod install
        script: cd ios && pod install --repo-update
      - name: Fetch signing files (app + packet tunnel)
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" --create
          app-store-connect fetch-signing-files "$TUNNEL_BUNDLE_ID" --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" --create
          keychain add-certificates
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
      - name: Build IPA (автоподпись Xcode с ключом ASC)
        script: |
          set -e
          BUILD_NUMBER=$(($(date +%s) % 100000000))
          # 1) сборка без подписи — dart-define попадают в Generated.xcconfig
          flutter build ios --release --no-codesign --target lib/main_prod.dart \
            --build-number "$BUILD_NUMBER" \
            --dart-define sentry_dsn= --dart-define subscription_url="$SUBSCRIPTION_URL"
          # 2) ключ ASC на диск для -allowProvisioningUpdates
          mkdir -p ~/private_keys
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          # 3) архив: Xcode сам создаёт управляемый профиль со всеми возможностями (App Groups, Network Extension)
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath $CM_BUILD_DIR/Runner.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM=K7BZZQL253 CODE_SIGN_STYLE=Automatic COMPILER_INDEX_STORE_ENABLE=NO
          # 4) экспорт в ipa (метод app-store)
          cat > /tmp/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store</string>
          <key>teamID</key><string>K7BZZQL253</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $CM_BUILD_DIR/Runner.xcarchive \
            -exportPath $CM_BUILD_DIR/ipa -exportOptionsPlist /tmp/export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  macos-notarize:
    name: macOS — подпись Developer ID + нотаризация
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: app_store_connect_artem
    environment:
      groups: [asc_signing, macos_devid, okno]
      vars:
        BUNDLE_ID: app.okno.family
      flutter: 3.38.5
      xcode: latest
    scripts:
      - name: Prepare
        script: |
          set -e
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
      - name: Fetch hiddify-core macOS framework
        script: |
          set -e
          CORE_VERSION=$(grep core.version dependencies.properties | cut -d= -f2)
          mkdir -p macos/Frameworks && curl -fL "https://github.com/hiddify/hiddify-core/releases/download/v${CORE_VERSION}/hiddify-lib-macos.tar.gz" | tar xz -C macos/Frameworks
      - name: Import Developer ID certificate
        script: |
          set -e
          keychain initialize
          echo "$MACOS_DEVID_CERT_P12" | base64 --decode > /tmp/devid.p12
          keychain add-certificates --certificate /tmp/devid.p12 --certificate-password "$MACOS_DEVID_CERT_PASSWORD"
      - name: Build & sign macOS app
        script: |
          set -e
          flutter build macos --release --target lib/main_prod.dart \
            --dart-define sentry_dsn= --dart-define subscription_url="$SUBSCRIPTION_URL"
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          codesign --force --deep --options runtime --timestamp \
            --sign "Developer ID Application" "$APP"
      - name: Make DMG, notarize & staple
        script: |
          set -e
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          npm install -g appdmg || true
          mkdir -p out
          hdiutil create -volname Okno -srcfolder "$APP" -ov -format UDZO out/Okno-macOS.dmg
          app-store-connect notarize out/Okno-macOS.dmg \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY"
          xcrun stapler staple out/Okno-macOS.dmg
    artifacts:
      - out/*.dmg
    publishing:
      scripts:
        - name: done
          script: echo "Notarized DMG in artifacts"
